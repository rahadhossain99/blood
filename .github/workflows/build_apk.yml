name: Fast Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Restore or create debug.keystore and environment files
      - name: Prepare Build Environment
        run: |
          # 1. Create debug.keystore if missing
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure .env exists for Secrets Gradle plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      # Official Gradle Setup with caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Assemble Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.parallel=true \
            -x test \
            -x lint \
            -x lintVitalRelease

      - name: Locate Generated APK
        id: apk-path
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoktoBondhu-Debug-APK
          path: ${{ steps.apk-path.outputs.apk_file }}
          retention-days: 14
          if-no-files-found: error
