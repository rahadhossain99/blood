name: Fast Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Cancel previous runs for the same branch/PR to save build quota and time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Official Gradle Setup with Supercharged Build Cache & Daemon Acceleration
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Ensure Execution Permissions
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      # Ultra-fast assembly bypassing heavy linting/unit tests for lightning speed
      - name: Fast Assemble Debug APK
        run: |
          BUILD_CMD="gradle"
          if [ -f "./gradlew" ]; then
            BUILD_CMD="./gradlew"
          fi
          
          $BUILD_CMD assembleDebug \
            --build-cache \
            --parallel \
            --configuration-cache \
            --max-workers=4 \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true \
            -x test \
            -x lint \
            -x lintVitalRelease

      - name: Locate Generated APK
        id: apk-path
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoktoBondhu-Debug-APK
          path: ${{ steps.apk-path.outputs.apk_file }}
          retention-days: 14
          if-no-files-found: error
